<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYFYS Campaign Library</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fauna+One&display=swap" rel="stylesheet">
    <!-- Compiled CSS -->
    <link rel="stylesheet" href="styles/styles/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TYFYS Campaign Library</div>
            <ul class="nav-links nav-inactive">
                <li><a href="#landing" class="nav-link active-link">Home</a></li>
                <li><a href="#heroes" class="nav-link">Heroes</a></li>
                <li><a href="#characters" class="nav-link">Characters</a></li>
                <li><a href="#places" class="nav-link">Places</a></li>
                <li><a href="#headlines" class="nav-link">Headlines</a></li>
                <li><a href="#lore" class="nav-link">Lore</a></li>
            </ul>
            <div class="burger" aria-label="Toggle navigation" aria-expanded="false" role="button" tabindex="0">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Landing Section -->
        <section id="landing" class="section active">
            <div class="banner-container">
                <div class="banner-slider">
                    <!-- Add your banner images here -->
                    <img src="/images/banner_history.webp" alt="Banner History" class="banner-image">
                    <img src="/images/banner_adventurers.webp" alt="Banner Adventurers" class="banner-image">
                    <img src="/images/banner_airship.webp" alt="Banner Airship" class="banner-image">
                    <img src="/images/banner_landscape.webp" alt="Banner Landscape" class="banner-image">
                </div>
                <button class="banner-arrow banner-arrow-left">&lt;</button>
                <button class="banner-arrow banner-arrow-right">&gt;</button>
            </div>
            <div class="magnified-view">
                <img src="" alt="Magnified Image" class="magnified-image">
                <button class="close-magnified">&times;</button>
            </div>
            <div class="cta-buttons">
                <a href="#heroes" class="btn nav-link">Heroes</a>
                <a href="#characters" class="btn nav-link">Characters</a>
                <a href="#places" class="btn nav-link">Places</a>
                <a href="#headlines" class="btn nav-link">Headlines</a>
                <a href="#lore" class="btn nav-link">Lore</a>
            </div>
        </section>

        <!-- Heroes Section -->
        <section id="heroes" class="section">
            <div class="grid-container" id="heroes-container">
                <!-- Dynamic Hero Cards will be inserted here -->
            </div>
        </section>

        <!-- Characters Section -->
        <section id="characters" class="section">
            <div class="grid-container" id="characters-container">
                <!-- Dynamic Character Cards will be inserted here -->
            </div>
        </section>

        <!-- Places Section -->
        <section id="places" class="section">
            <div class="grid-container" id="places-container">
                <!-- Dynamic Place Cards will be inserted here -->
            </div>
        </section>

        <!-- Headlines Section -->
        <section id="headlines" class="section">
            <div class="grid-container" id="headlines-container">
                <!-- Dynamic Headline Entries will be inserted here -->
            </div>
        </section>

        <!-- Lore Section -->
        <section id="lore" class="section">
            <div class="timeline-container">
                <div class="timeline-line"></div>
                <div class="timeline-items" id="lore-container">
                    <!-- Dynamic Timeline Items will be inserted here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Structure -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title">Title</h2>
            <div id="modal-description">Description</div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="scripts/app.js"></script>
</body>
</html>
