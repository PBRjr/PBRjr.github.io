<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>TYFYS Campaign Library</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fauna+One&display=swap" rel="stylesheet">
    <!-- Compiled CSS -->
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TYFYS Campaign Library</div>
            <ul class="nav-links">
              <li><a href="#landing" class="nav-link active-link">Home</a></li>
              <li><a href="#heroes" class="nav-link">Heroes</a></li>
              <li><a href="#characters" class="nav-link">Characters</a></li>
              <li><a href="#factions" class="nav-link">Factions</a></li>
              <li><a href="#places" class="nav-link">Places</a></li>
              <li><a href="#headlines" class="nav-link">Headlines</a></li>
              <li><a href="#world-history" class="nav-link">World History</a></li>
              <li><a href="#items" class="nav-link">Lore, Items, & Artifacts</a></li>
          </ul>
            <div class="burger" aria-label="Toggle navigation" aria-expanded="false" role="button" tabindex="0">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <main>
        <div class="loader-container">
            <div class="loader"></div>
        </div>
        <!-- Landing Section -->
        <section id="landing" class="section">
            <div class="banner">
                <div class="banner-container">
                    <div class="banner-slider">
                        <!-- Add your banner images here -->
                        <img src="/images/banner_history.webp" alt="The history of Eberron, I guess" class="banner-image">
                        <img src="/images/banner_adventurers.webp" alt="Weary adventurers travel through a stone gate to nowhere while being observed by Wookies" class="banner-image">
                        <img src="/images/banner_airship.webp" alt="An airship flies over the City of Towers" class="banner-image">
                        <img src="/images/banner_landscape.webp" alt="The beautiful Aundarian countryside" class="banner-image">
                        <img src="/images/banner_protest.webp" alt="Mass protests escalate in Wroat over unyielding wartime production regulations" class="banner-image">
                    </div>
                    <div class="banner-title">Explore the World of Eberron</div>
                    <button class="banner-arrow banner-arrow-left">&lt;</button>
                    <button class="banner-arrow banner-arrow-right">&gt;</button>
                    <div class="banner-indicators">
                    <div class="indicator-dot active" data-index="0"></div>
                    <div class="indicator-dot" data-index="1"></div>
                    <div class="indicator-dot" data-index="2"></div>
                    <div class="indicator-dot" data-index="3"></div>
                </div>
                </div>
            </div>

          <!-- Random Featured Content -->
          <div class="featured-content">
            <div class="featured-controls">
              <button id="random-article-button" class="btn">Show Another Random Article</button>
            </div>
              <div class="featured-header">
                  <h2 id="featured-name">Featured Content</h2>
                  <span id="featured-source">From Factions</span>
              </div>
              <div id="featured-description"></div>
          </div>
        </section>

        <!-- Heroes Section -->
        <section id="heroes" class="section">
            <div class="grid-container" id="heroes-container">
                <!-- Dynamic Hero Cards will be inserted here -->
            </div>
        </section>

        <!-- Characters Section -->
        <section id="characters" class="section">
            <div class="grid-container" id="characters-container">
                <!-- Dynamic Character Cards will be inserted here -->
            </div>
        </section>

        <!-- Factions Section -->
        <section id="factions" class="section">
            <div class="grid-container" id="factions-container">
                <!-- Dynamic Faction Cards will be inserted here -->
            </div>
        </section>

        <!-- Places Section -->
        <section id="places" class="section">
            <div class="grid-container" id="places-container">
                <!-- Dynamic Place Cards will be inserted here -->
            </div>
        </section>

        <!-- Headlines Section -->
        <section id="headlines" class="section">
            <div class="grid-container" id="headlines-container">
                <!-- Dynamic Headline Entries will be inserted here -->
            </div>
        </section>

                <!-- World History Section (renamed from "lore") -->
        <section id="world-history" class="section">
          <div class="timeline-container">
              <div class="timeline-line"></div>
              <div class="timeline-items grid-container" id="lore-container">
                  <!-- Dynamic Timeline Items will be inserted here -->
              </div>
          </div>
        </section>

        <!-- Lore, Items, & Artifacts Section (new) -->
        <section id="items" class="section">
          <div class="grid-container" id="items-container">
              <!-- Dynamic Item Cards will be inserted here -->
          </div>
        </section>
    </main>

    <div class="magnified-view">
        <div class="magnified-content">
            <img src="" alt="Magnified Image" class="magnified-image">
            <div class="magnified-caption"></div>
        </div>
        <button class="close-magnified">&times;</button>
    </div>

    <!-- Modal Structure -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="close-button" aria-label="Close modal">&times;</button>
            <div class="modal-body">
                <h2 id="modal-title">Title</h2>
                <div id="modal-description">Description</div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
